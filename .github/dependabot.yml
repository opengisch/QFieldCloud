version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3

  - package-ecosystem: "pip"
    directories:
      - "/docker-app/requirements"
      - "/docker-qgis"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "stripe"

  - package-ecosystem: "docker"
    directories:
      - "/docker-app"
      - "/docker-qgis"
      - "/docker-nginx"
      - "/docker-createbuckets"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
